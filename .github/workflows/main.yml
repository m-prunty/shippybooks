name: Deploy FastAPI

on:
  push:
    branches:
      - master



jobs:
  build:
    runs-on: [fastapi]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          cd /opt/fastapi/shippybooks
          make install-prod


      - name: Sync app files
        run: |
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            ./ /opt/fastapi/shippybooks/



      - name: Restart FastAPI service
        run: |
          sudo systemctl daemon-reload
          sudo systemctl restart fastapi
