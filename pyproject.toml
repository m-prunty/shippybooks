[project]
name = "shippybooks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marcus Prunty", email = "marcusprunty@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.15",
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=9.1.1",
]
[tool.mypy]
python_executable = ".venv/bin/python"
python_version = "3.11"
plugins = ["pydantic.mypy"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
shippybooks = "shippybooks.main:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"
