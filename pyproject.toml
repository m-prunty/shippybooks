[project]
name = "shippybooks"
version = "0.1.0"
description = "CQRS implementation for a book store"
readme = "README.md"
authors = [
    { name = "Marcus Prunty", email = "marcusprunty@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.15",
    "fastapi>=0.138.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.49.0",
]

[project.scripts]
shippybooks = "shippybooks.main:main"
readme ="scripts.gen_readme:main"

[dependency-groups]
dev = [
    "graphviz>=0.21",
    "ipython>=9.18.1",
    "mypy>=1.10.0",
    "pylint>=3.3.6",  # Provides the pyreverse CLI.
    "pytest>=9.1.1",
]
[tool.mypy]
python_executable = ".venv/bin/python"
python_version = "3.11"
plugins = ["pydantic.mypy"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"
