[project]
name = "shippybooks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marcus Prunty", email = "marcusprunty@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.15",
    "fastapi>=0.138.0",
    "pytest>=9.1.1",
    "uvicorn>=0.49.0",
]


[tool.mypy]
pythonpath = ["src"]

[project.scripts]
shippybooks = "shippybooks.main:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"
